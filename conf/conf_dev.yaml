# ⚠️ 本文件入库（git tracked）——严禁写入任何明文凭据。
# 所有密钥字段一律留空 ""，运行时由环境变量注入；覆盖逻辑见
# backend/internal/conf/conf.go 的 applyEnvOverrides（env 非空即覆盖 yaml）。
# 服务器上把真实值放在 600 权限的 env 文件里（默认 /etc/quanty/backend.env），
# 由 server_deploy_backend.sh 载入。本地开发用 export 或 direnv，别写回这里。
server:
  host: "0.0.0.0"
  port: 8080
  mode: "debug"

network:
  http_proxy: "http://127.0.0.1:1087"
  https_proxy: "http://127.0.0.1:1087"
  no_proxy: "127.0.0.1,localhost"

paths:
  logs_dir: "logs"
  strategies_dir: "strategies"

db:
  type: "mysql"
  # 3306 = quanty-mysql（本业务）。别写 3307——那是 tg-jobs-mysql，另一个业务的生产库。
  host: "127.0.0.1"
  port: "3306"
  user: "quanty"
  pass: ""  # ← 由环境变量 DB_PASS 注入
  name: "quanty_trade"

admin:
  username: "admin"
  password: ""  # ← 由环境变量 ADMIN_PASSWORD 注入

security:
  jwt_secret: ""  # ← 由环境变量 JWT_SECRET 注入
  config_encryption_key: ""  # ← 由环境变量 CONFIG_ENCRYPTION_KEY 注入

exchange:
  name: "binance"
  binance:
    api_key: ""  # ← 由环境变量 BINANCE_API_KEY 注入
    api_secret: ""  # ← 由环境变量 BINANCE_API_SECRET 注入
    testnet: false
    market: "usdm"
    base_url: "https://fapi.binance.com"
    ws_base_url: "wss://fstream.binance.com"
    wsapi_url: "wss://ws-api.binance.com:443/ws-api/v3"

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  prefix: "qt"

telegram:
  enabled: true
  bot_token: ""  # ← 由环境变量 TELEGRAM_BOT_TOKEN 注入
  poll_timeout_seconds: 30

# 飞书/Lark 群机器人 ERROR 告警（详见 conf_pro.yaml 注释）
lark:
  enabled: false
  webhook_url: ""
  secret: ""
  min_interval_seconds: 5
  max_per_minute: 12

ai:
  optimizer:
    provider: "openrouter"
    model: "anthropic/claude-opus-4.7"
    api_url: "https://openrouter.ai/api/v1/chat/completions"
    api_key: ""  # ← 由环境变量 OPENROUTER_API_KEY 注入
    http_referer: "https://quanty.qxyz.xyz"
    app_name: "QuantyTrade"
