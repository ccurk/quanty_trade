# 跨所库存再平衡配置示例。复制为 conf/rebalance.yaml(勿入库)后按需修改。
# 白名单地址不在这里 —— 走 UI 界面配置(存数据库)。这里只放策略带 + 安全限额。
#
# 方向语义(会随库存翻转,别用 source/target 混淆):
#   execExchange      = 被管理库存的执行所(做市在这挂单,库存在这漂移) = gate
#   reservoirExchange = 资金水库(补仓从它来,回落往它去)              = binance
#   低于 min → reservoir→exec 补到 opt ;  高于 max → exec→reservoir 回落到 opt

enable: false                # 总开关。false = 整模块 no-op
execExchange: gate
reservoirExchange: binance

dryRun: true                 # true = 只算+日志, 绝不真提现(强烈建议先 true 跑通)
mode: recommend              # recommend=只建议 | semi=逐笔确认后提 | auto=达阈值自动提

cooldownMinutes: 30          # 同一资产两次搬运的最小间隔(链上到账要几分钟~几小时, 防重复在途)
maxPerTransferUsdt: 2000     # 单笔上限(折USDT), 硬 safety —— 代码 bug 也搬不超
maxPerDayUsdt: 5000          # 单日累计上限, 硬 safety

assets:
  - asset: USDT
    network: TRC20           # 链!错链=永久丢钱, 必填。USDT 建议 TRC20(费低)
    opt: 1000                # 目标库存(搬运后回到这个值)
    min: 500                 # 低于→补
    max: 1500                # 高于→回落
    minTransfer: 50          # dust: 缺口 < 50 USDT 不搬(免白付提现费)

  # 需要管理基础币库存时再加(做市卖出会攒/耗基础币):
  # - asset: SOL
  #   network: SOL
  #   opt: 5
  #   min: 2
  #   max: 10
  #   minTransfer: 0.2
